<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover é obrigatório para env(safe-area-inset-*) funcionar (notch / gesture bar) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Evita o "flash" branco/escuro ao trocar de rota dentro do app -->
    <meta name="color-scheme" content="light" />
    <!-- iOS: não deixa o Safari/WebView esticar o texto no retrato -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f97316" />
    <meta
      name="description"
      content="EGG — Educação Geral Gamificada: plataforma de estudos gamificada com XP, níveis, trilhas, conquistas e ranking para o Ensino Fundamental e Médio."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>EGG — Educação Geral Gamificada</title>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar o EGG.</noscript>
    <div id="root"></div>
  </body>
</html>
